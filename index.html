function appraiserFee(price, tier){ const t = APPRAISERS[tier]; let f = Math.round(price * t.rate / 10) * 10; f = Math.max(t.min, Math.min(t.max, f)); f = Math.min(f, Math.max(50, Math.floor(price * 0.10))); return f; }

function migrate(s){
 s.credit = (s.credit==null?600:s.credit); s.loans = s.loans||[]; s.redeemed = s.redeemed||{}; s.loanSeq = s.loanSeq||1; s.up = s.up||{decor:0,ads:0,tool:0,vip:0}; s.market = s.market||{}; return s;
}

function load(){
 try{ const r = localStorage.getItem('xiaoyuan-dad-save-v1'); if(r){ S = migrate(JSON.parse(r)); return; } }catch(e){}
 S = defaultState();
}
function fmt(n){ return '¥' + Math.round(n).toLocaleString('zh-CN'); }
function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none',3000); }
function log(t){ S.log.unshift('第'+S.day+'天 · '+t); if(S.log.length>80) S.log.pop(); }
function marketInit(){ S.market = {}; CATALOG.forEach(c=>{ if(!(c.brand in S.market)) S.market[c.brand] = rand(0.92,1.12); }); }
function marketDrift(){ Object.keys(S.market).forEach(k=>{ let m = S.market[k] * rand(0.94,1.07); S.market[k] = Math.max(0.75, Math.min(1.35, m)); }); }
function genItem(){
 // 70% 出包包/衣服/鞋子，30% 出名表；名表贵、稀有
 const pool = Math.random()<0.7 ? CATALOG.filter(c=>c.cat!=='名表') : CATALOG.filter(c=>c.cat==='名表');
 const c = pick(pool);
 const cond = pick(CONDS);
 const nominal = Math.round(rand(c.lo, c.hi) * cond.mult * (S.market[c.brand]||1) / 100) * 100;
 const isFake = Math.random() < 0.25;
 const trueValue = isFake ? Math.round(nominal*0.15/100)*100 : nominal;
 const ask = isFake ? Math.round(nominal * rand(0.5,0.75)/100)*100 : Math.round(trueValue * rand(0.55,0.85) / 100) * 100;
 return {id:Date.now()+Math.random(), brand:c.brand, cat:c.cat, model:c.model, color:c.color, shape:c.shape, cond:cond.name, condLabel:cond.label, nominal, trueValue, ask, isFake, minAccept: Math.round(ask*rand(0.72,0.9)/100)*100, identified:false, identResult:null, appraiser:null, secondIdentified:false, secondResult:null, secondAppraiser:null, rounds:0, seller:pick(NAMES), negotiated:null};
}
function genAffordableItem(){
 const cheap = CATALOG.filter(c=>c.cat!=='名表');
 for(let tries=0; tries<20; tries++){
   const it = genItem();
   if(cheap.some(b=>b.brand===it.brand && b.model===it.model) && it.ask <= Math.min(40000, Math.max(15000, S.money*0.8))) return it;
 }
 const it = genItem(); it.ask = Math.min(it.ask, 30000); it.minAccept = Math.round(it.ask*0.8/100)*100; it.trueValue = Math.max(it.trueValue, it.ask); return it;
}
function genCustomers(){
 const n = 3 + S.up.decor + (Math.random()<0.3?1:0);
 S.customers = [];
 for(let i=0;i<n;i++) S.customers.push(genItem());
 let affordable = S.customers.filter(c=>c.ask <= S.money).length;
 let guard = 0;
 while(affordable < 2 && guard < 5){ S.customers[guard % S.customers.length] = genAffordableItem(); affordable = S.customers.filter(c=>c.ask <= S.money).length; guard++; }
 if(Math.random() < 0.08 + S.up.vip*0.08){
   const it = genItem(); it.model = '★ 稀有藏品 · ' + it.model; it.nominal = Math.round(it.nominal*1.8/100)*100; it.trueValue = it.isFake? Math.round(it.trueValue*1.8/100)*100 : it.nominal; it.ask = Math.round(it.trueValue*0.7/100)*100; it.minAccept = Math.round(it.ask*0.85/100)*100; S.customers.push(it); log('稀有藏品出现：'+it.brand+' '+it.model);
 }
}
// ===== 银行 =====
function rateFor(credit){ if(credit>=750) return 0.0435; if(credit>=600) return 0.058; if(credit>=550) return 0.072; if(credit>=500) return 0.09; return 0.108; }
function limitFor(credit){ if(credit>=750) return 500000; if(credit>=700) return 300000; if(credit>=650) return 200000; if(credit>=600) return 150000; if(credit>=550) return 80000; if(credit>=500) return 30000; return 0; }
function activeLoans(){ return S.loans.filter(l=>l.status==='进行中'); }
function loanMonthly(l){ return Math.round(l.principal * (1 + l.rate * l.months/12) / l.months / 100) * 100; }
function loanTotalInterest(l){ return Math.round(l.principal * l.rate * l.months/12 / 100) * 100; }
function nextDueDay(l){ return l.startDay + (l.paidMonths+1)*10; } // 游戏里 1 个月 = 10 天
function borrow(amount, months, method){
 amount = Math.round(amount/100)*100;
 if(!amount || amount<=0) return toast('请输入借款金额');
 if(amount > limitFor(S.credit)) return toast('超过可借额度（当前可借 '+fmt(limitFor(S.credit))+'）');
 if(activeLoans().length>=3) return toast('同时最多 3 笔贷款，先还一笔');
 const rate = rateFor(S.credit);
 const loan = {id:S.loanSeq++, principal:amount, months, method, rate, startDay:S.day, dueDay:S.day+months*10, paidMonths:0, paidTotal:0, status:'进行中', overdue:false};
 S.loans.push(loan); S.money += amount;
 log('银行借款 '+fmt(amount)+'，'+months+'个月，'+method+'，年利率 '+(rate*100).toFixed(2)+'%');
 toast('借款成功，到账 '+fmt(amount)); render();
}
function payInstallment(id){
 const l = S.loans.find(x=>x.id===id); if(!l||l.status!=='进行中') return;
 const due = loanMonthly(l) * (l.overdue?1.05:1);
 if(S.money < due) return toast('资金不足，无法还款');
 S.money -= due; l.paidTotal += due; l.paidMonths++; l.overdue = false;
 if(l.paidMonths >= l.months){ l.status='已还清'; S.credit = Math.min(850, S.credit+10); log('贷款已还清（分期 '+l.months+' 期），信用分 +10 → '+S.credit); toast('本笔贷款已还清！信用分 +10'); }
 else { S.credit = Math.min(850, S.credit+2); log('按期还款第 '+l.paidMonths+'/'+l.months+' 期 '+fmt(due)+'，信用分 +2 → '+S.credit); toast('已还第 '+l.paidMonths+' 期'); }
 render();
}
function payLump(id){
 const l = S.loans.find(x=>x.id===id); if(!l||l.status!=='进行中') return;
 const total = l.principal + loanTotalInterest(l) + (l.overdue? Math.round(l.principal*0.02/100)*100 : 0);
 if(S.money < total) return toast('资金不足，无法一次还清');
 S.money -= total; l.paidTotal += total; l.status='已还清';
 S.credit = Math.min(850, S.credit + (l.overdue?0:15));
 log('一次还清贷款 '+fmt(total)+'（本金 '+fmt(l.principal)+' + 利息 '+fmt(loanTotalInterest(l))+'），信用分 '+(l.overdue?'未加（曾逾期）':' +15 → '+S.credit));
 toast('一次还清成功！'); render();
}

function redeem(code){
 code = (code||'').trim();
 if(!(code in REDEEM_CODES)) return toast('兑换码无效，请检查');
 if(S.redeemed[code]) return toast('该兑换码已使用过，不能重复领取');
 const amt = REDEEM_CODES[code];
 S.redeemed[code] = true; S.money += amt;
 log('兑换成功：'+code+'，获得 '+fmt(amt)+' 现金');
 openModal('<h3>兑换成功</h3><div class="meta" style="font-size:16px">兑换码 <b>'+code+'</b><br>获得现金：<b style="font-size:22px">'+fmt(amt)+'</b><br>当前资金：<b>'+fmt(S.money)+'</b></div><div class="btnrow"><button class="btn gold" onclick="closeModal()">收下</button></div>');
 render();
}

// 鉴定师傅选择弹窗：buy=收货时，inv=仓库二次鉴定
function openAppraiser(idx, where){
 const it = where==='buy' ? S.customers[idx] : S.inv[idx];
 if(!it) return;
 const price = where==='buy' ? (it.negotiated||it.ask) : (it.buyPrice||it.trueValue);
 let h = '<h3>请鉴定师傅 · '+it.model+'</h3><div class="meta">商品价：<b>'+fmt(price)+'</b><br>费用按商品价比例，不超过 10%，绝不比商品贵。</div>';
 APPRAISERS.forEach((t,ti)=>{
   const fee = appraiserFee(price, ti);
   h += '<div class="tier"><b>'+t.name+'</b> · 准确率 '+(t.acc*100)+'%<br><span class="small">'+t.desc+'</span><br>鉴定费：<b>'+fmt(fee)+'</b><div class="btnrow"><button class="btn gold" onclick="doAppraise('+idx+',\''+where+'\','+ti+','+fee+')">请这位师傅</button></div></div>';
 });
 h += '<div class="btnrow"><button class="btn dark" onclick="closeModal()">先不鉴定</button></div>';
 openModal(h);
}
function doAppraise(idx, where, tier, fee){
 const it = where==='buy' ? S.customers[idx] : S.inv[idx];
 if(!it) return;
 if(S.money < fee){ closeModal(); return toast('资金不足，付不起鉴定费'); }
 S.money -= fee;
 const t = APPRAISERS[tier];
 const correct = Math.random() < t.acc;
 const result = correct ? (it.isFake?'fake':'real') : (it.isFake?'real':'fake');
 if(where==='buy'){ it.identified = true; it.identResult = result; it.appraiser = t.name; }
 else { it.secondIdentified = true; it.secondResult = result; it.secondAppraiser = t.name; it.identified = true; it.identResult = result; it.appraiser = t.name + '（仓库二次鉴定）'; }
 closeModal();
 log('鉴定（'+t.name+'，费 '+fmt(fee)+'）：'+it.brand+' '+it.model+' → '+(result==='fake'?'疑似假货':'大概率真品')+(correct?'':'（注意：该档位可能看错）'));
 toast(result==='fake'?'鉴定：疑似高仿，小心！':'鉴定：大概率真品');
 render();
}
function bargain(i){
 const c = S.customers[i]; if(!c) return;
 openModal('<h3>砍价 · '+c.model+'</h3><div class="meta">卖家要价 <b>'+fmt(c.ask)+'</b> · 底线未知<br>出价太低可能谈崩（第 '+(c.rounds+1)+'/2 轮）</div><input type="number" id="offerInput" value="'+Math.round(c.ask*0.8/100)*100+'"><div class="btnrow"><button class="btn gold" onclick="submitBargain('+i+')">出价</button><button class="btn dark" onclick="closeModal()">取消</button></div>');
}
function submitBargain(i){
 const c = S.customers[i]; const v = Number(document.getElementById('offerInput').value);
 if(!v||v<=0){ toast('请输入有效出价'); return; }
 closeModal(); c.rounds++;
 if(v >= c.minAccept){ c.negotiated = v; log('砍价成功：'+c.model+' 谈到 '+fmt(v)); toast('砍价成功！谈到 '+fmt(v)); }
 else {
   if(Math.random()<0.5){ log('砍价谈崩：'+c.seller+' 生气走了（'+c.model+'）'); S.customers.splice(i,1); toast('谈崩了，卖家走了…'); }
   else { const counter = Math.round((v + c.minAccept)/2/100)*100; c.ask = counter; log('对方还价 '+fmt(counter)+'（'+c.model+'）'); toast('对方还价 '+fmt(counter)+'，可以再谈'); }
 }
 render();
}

 if(S.money < price){ toast('资金不足！先卖掉库存回血，或去银行借款'); return; }
 S.money -= price;
 S.inv.push({id:c.id, brand:c.brand, cat:c.cat, model:c.model, color:c.color, shape:c.shape, cond:c.cond, buyPrice:price, trueValue:c.trueValue, nominal:c.nominal, isFake:c.isFake, identified:c.identified, identResult:c.identResult, appraiser:c.appraiser, secondIdentified:false, secondResult:null, secondAppraiser:null});

 else log('收购：'+c.brand+' '+c.model+'，花了 '+fmt(price));

 else { closeModal(); toast('买家嫌贵，走了…'); log('买家被抬价吓走：'+it.model); }

function acceptSell(i, price){
 const it = S.inv[i]; if(!it) return;
 closeModal();
 S.money += price; const prof = price - it.buyPrice; S.profit += prof; S.deals++;
 S.inv.splice(i,1);
 const risk = it.isFake ? (it.secondIdentified ? 0.45 : 0.65) : 0;
 if(it.isFake && Math.random()<risk){
   const fine = 5000; S.money -= fine; S.rep = Math.max(0, S.rep-12);
   log('⚠ 假货纠纷！买家发现 '+it.model+' 是高仿，罚款 '+fmt(fine)+'，声望 -12'); toast('假货纠纷！罚款 '+fmt(fine));
 } else {
   S.rep = Math.min(100, S.rep+2);
   log('售出：'+it.brand+' '+it.model+'，卖了 '+fmt(price)+'，利润 '+(prof>=0?'+':'')+fmt(prof)); toast('成交！利润 '+(prof>=0?'+':'')+fmt(prof));
 }
 if(S.money>=200000 && S.level<5){ S.level++; log('店铺升级！达到 Lv.'+S.level); toast('店铺升级到 Lv.'+S.level+'！'); }
 render();
}

   + '<div class="meta">年利率 '+(l.rate*100).toFixed(2)+'% · 总利息 '+fmt(totalInt)
   + '<br>到期日：第 '+l.dueDay+' 天（今天第 '+S.day+' 天）'
   + (l.method==='分期还款' ? '<br>每月应还 '+fmt(loanMonthly(l))+' · 已还 '+l.paidMonths+'/'+l.months+' 期 · 下期应还日：第 '+nextDueDay(l)+' 天' : '<br>到期一次还：'+fmt(l.principal+totalInt))
   + (l.overdue? '<br><b style="color:#ff9a8a">已逾期！请尽快还款，逾期会扣信用分</b>':'')
   + '</div><div class="btnrow">'
   + (l.status==='进行中' && l.method==='分期还款' ? '<button class="btn gold" onclick="payInstallment('+l.id+')">还本期 '+fmt(loanMonthly(l)*(l.overdue?1.05:1))+'</button>' : '')
   + (l.status==='进行中' && l.method==='一次还清' ? '<button class="btn gold" onclick="payLump('+l.id+')">一次还清 '+fmt(l.principal+totalInt)+'</button>' : '')
   + '</div></div>';
 });
 p.innerHTML = h;
}
function previewLoan(){
 const amt = Number(document.getElementById('loanAmt').value);
 const months = Number(document.getElementById('loanMonths').value);
 const method = document.getElementById('loanMethod').value;
 const rate = rateFor(S.credit);
 const totalInt = Math.round(amt * rate * months/12 /100)*100;
 const monthly = Math.round(amt * (1 + rate*months/12) / months /100)*100;
 document.getElementById('loanPreview').innerHTML = '借款 '+fmt(amt)+' · '+months+'个月 · '+method+'<br>年利率 <b>'+(rate*100).toFixed(2)+'%</b> · 总利息 <b>'+fmt(totalInt)+'</b><br>'+(method==='分期还款' ? '每月应还 <b>'+fmt(monthly)+'</b>' : '到期一次还 <b>'+fmt(amt+totalInt)+'</b>')+'<br>到期日：第 <b>'+(S.day+months*10)+'</b> 天（今天第 '+S.day+' 天）<br>可借额度 '+fmt(limitFor(S.credit))+'，信用分 '+S.credit;
}
function doBorrow(){
 const amt = Number(document.getElementById('loanAmt').value);
 const months = Number(document.getElementById('loanMonths').value);
 const method = document.getElementById('loanMethod').value;
 borrow(amt, months, method);
}
function renderGift(){
 const p = document.getElementById('panel');
 let h = '<h2>兑换 · 存档</h2><div class="hint">兑换码各只能用一次，用过再输会提示“已使用过”。兑换记录跟着存档一起保存，读档后仍不能重复领。</div>'
 + '<div class="up"><b>兑换窗口</b><div class="meta">已用兑换码：'+(Object.keys(S.redeemed).length? Object.keys(S.redeemed).join('、') : '无')+'</div>'
 + '<input type="text" id="redeemInput" placeholder="输入兑换码，如：代号1" style="width:100%;padding:10px;border-radius:8px;border:1px solid #8a6d2f;background:#0f0d08;color:#ffd76a;font-size:15px;margin:6px 0">'
 + '<div class="btnrow"><button class="btn gold" onclick="redeem(document.getElementById(\'redeemInput\').value)">兑换</button></div>'
 + '<div class="small">已知兑换码：代号1 = ¥10,000,000；55544 = ¥100,000,000（各一次）</div></div>'
 + '<div class="up"><b>存档</b><div class="small">自动存档：每次操作后自动保存（浏览器 localStorage）。手动存档：3 个存档位。</div>';
 [1,2,3].forEach(n=>{
   let meta = '';
   try{ const r = localStorage.getItem('xiaoyuan-dad-save-slot'+n); if(r){ const s = JSON.parse(r); meta = ' · 第 '+s.day+' 天 · '+fmt(s.money); } }catch(e){}
   h += '<div class="slot"><b>存档位 '+n+'</b><span class="small">'+(meta||' · 空')+'</span><div class="btnrow"><button class="btn gold" onclick="saveSlot('+n+')">保存到此位</button><button class="btn dark" onclick="loadSlot('+n+')">读档</button></div></div>';
 });
 h += '</div><div class="up"><b>存档码（导出 / 导入）</b><div class="small">换设备 / 换浏览器时用：导出复制存档码，回来粘贴导入即可续玩。</div><textarea id="exportBox" placeholder="点导出生成存档码"></textarea><div class="btnrow"><button class="btn dark" onclick="exportCode()">导出存档码</button></div><textarea id="importBox" placeholder="粘贴存档码到这里"></textarea><div class="btnrow"><button class="btn gold" onclick="importCode()">导入存档码</button></div></div>';
 p.innerHTML = h;
}
function renderShop(){
 const p = document.getElementById('panel');
 let h = '<h2>店铺升级</h2><div class="hint">用利润升级店铺，客流、成交率、鉴定能力都会提升。店铺等级随资金里程碑自动提升。</div>';
 UPGRADES.forEach(u=>{
   const lv = S.up[u.id]; const cost = Math.round(u.base * Math.pow(1.8, lv)/100)*100;
   h += '<div class="up"><b>'+u.name+' · Lv.'+lv+'</b><div class="meta" style="margin:6px 0">'+u.desc+'</div><div class="btnrow"><button class="btn gold" onclick="buyUpgrade(\''+u.id+'\','+cost+')" '+(lv>=3?'disabled':'')+'>'+(lv>=3?'已满级':'升级 '+fmt(cost))+'</button></div></div>';
 });
 h += '<div class="meta">成交总数：<b>'+S.deals+'</b> · 总利润：<b>'+fmt(S.profit)+'</b><br>目标：资金达到 ¥200,000 升级店铺，¥1,000,000 成为二奢大亨！</div>';
 if(S.money>=1000000) h += '<div class="clue">你已经是二奢大亨了！小圆爸爸专属，名副其实。</div>';
 p.innerHTML = h;
}
function buyUpgrade(id, cost){
 if(S.money<cost){ toast('资金不足'); return; }
 if(S.up[id]>=3){ toast('已满级'); return; }
 S.money -= cost; S.up[id]++; log('升级：'+UPGRADES.find(u=>u.id===id).name+' 到 Lv.'+S.up[id]); toast('升级成功！'); render();
}
function renderLog(){
 const p = document.getElementById('panel');
 p.innerHTML = '<h2>经营日志</h2><div class="log">'+(S.log.length? S.log.map(x=>'<div>'+x+'</div>').join('') : '<div>还没有记录，开始收第一件货吧。</div>')+'</div>';
}
function checkLoansOverdue(){
 S.loans.forEach(l=>{
   if(l.status!=='进行中' || l.overdue) return;
   if(l.method==='分期还款' && S.day > nextDueDay(l)){ l.overdue = true; S.credit = Math.max(350, S.credit-8); log('⚠ 贷款 #'+l.id+' 逾期！本期未按时还，信用分 -8 → '+S.credit+'，下期需加 5% 罚息'); }
   if(l.method==='一次还清' && S.day > l.dueDay){ l.overdue = true; S.credit = Math.max(350, S.credit-15); log('⚠ 贷款 #'+l.id+' 到期未还清，逾期！信用分 -15 → '+S.credit); }
 });
}
function endDay(){
 const rent = 500 * S.level;
 S.money -= rent;
 marketDrift();
 S.day++;
 checkLoansOverdue();
 if(Math.random()<0.15){ const bonus = Math.round(rand(2000,8000)/100)*100; S.money += bonus; S.rep = Math.min(100,S.rep+3); log('大客户光顾，顺手买了点小东西，收入 '+fmt(bonus)+'，声望 +3'); toast('大客户来了！+'+fmt(bonus)); }
 else if(Math.random()<0.12){ S.rep = Math.max(0,S.rep-3); log('市场传言：有人说你家有假货，声望 -3'); }
 genCustomers();
 log('第 '+S.day+' 天开始，付租金 '+fmt(rent)+'，来了 '+S.customers.length+' 位卖家');
 if(S.money<0){ toast('资金为负！快卖货回血，或去银行借款'); }
 render();
}
function resetGame(){
 if(!confirm('确定重新开局吗？当前进度会清空。')) return;
 try{ localStorage.removeItem('xiaoyuan-dad-save-v1'); }catch(e){}
 S = defaultState(); marketInit(); genCustomers(); log('新开局：小圆爸爸专属二奢店开张，启动资金 ¥50,000'); render(); toast('新开局，祝大卖！');
}
function openModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
load();
if(!S.market || !Object.keys(S.market).length) marketInit();
if(!S.customers || !S.customers.length) genCustomers();
if(!S.log.length) log('小圆爸爸专属二奢店开张，启动资金 ¥50,000');
render();
</script>
</body>
</html>
